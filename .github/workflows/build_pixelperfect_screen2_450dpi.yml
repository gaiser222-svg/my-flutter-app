                              height: 30,
                              child: Text(
                                'تحويلات',
                                textAlign: TextAlign.center,
                                textDirection: TextDirection.rtl,
                                style: TextStyle(
                                  fontSize: 18,
                                  color: Colors.white,
                                  fontWeight: FontWeight.normal,
                                ),
                              ),
                            ),
                          ),

                          // ------------------------------------------------
                          // Result Table
                          //
                          // APK:
                          // TableLayout
                          // padding = 20dp
                          // margin left/right = 10dp
                          // marginBottom = 6dp
                          //
                          // The row internals remain isolated so we can
                          // correct them independently after comparison.
                          // ------------------------------------------------
                          Positioned(
                            top: 170,
