name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Flutter project (android/ios/etc.)
        run: flutter create --platforms=android --org com.bankak --project-name bankak_app .

      - name: Create pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: bankak_app
          description: تطبيق بنكك - محاكاة تحويلات
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            intl: ^0.19.0
            path_provider: ^2.1.4
            gal: ^2.3.0
            permission_handler: ^11.3.1
            screenshot: ^3.0.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true

            assets:
              # الشاشة 1
              - assets/images/image1.png
              # الشاشة 2
              - assets/successscreenbg.png
              - assets/sucess.png
              - assets/sucess1.png
              - assets/sucess2.png
              - assets/sucess3.png
              - assets/sucess4.png
              - assets/sucess5.png
              - assets/sucess6.png
              - assets/sucess7.png
              - assets/sucess8.png
              - assets/sucessbutton.png
              - assets/resultcircle.png
              - assets/share.png
              - assets/print.png
              - assets/download.png
              - assets/qr.png
              - assets/newaddmore.png
              - assets/usdcr.png
              # الشاشة 3
              - assets/headerbg.png
              - assets/bankak_logo_exact.png
              - assets/ic_drawer.png
              - assets/back.png
              - assets/listarr.png
              - assets/ftothacc.png
              - assets/ftmobileacc.png
              - assets/cardsupplementary.png
              # الشاشة 4
              - assets/white_logo_n.png
              - assets/back_ar.png
              - assets/reminder_ar.png
              - assets/block_icon.png

            fonts:
              - family: Rubik
                fonts:
                  - asset: assets/fonts/Rubik-Regular.ttf
          EOF

      - name: Create lib/models/transaction_model.dart
        run: |
          mkdir -p lib/models
          cat << 'EOF' > lib/models/transaction_model.dart
          class TransactionModel {
            final String opNumber;
            final String dateTime;
            final String name;
            final String amount;
            final String toAccount;
            final String fromAccount;

            TransactionModel({
              required this.opNumber,
              required this.dateTime,
              required this.name,
              required this.amount,
              required this.toAccount,
              this.fromAccount = '1003 0815 8561 0001',
            });

            Map<String, dynamic> toMap() {
              return {
                'opNumber': opNumber,
                'dateTime': dateTime,
                'name': name,
                'amount': amount,
                'toAccount': toAccount,
                'fromAccount': fromAccount,
              };
            }

            factory TransactionModel.fromMap(Map<String, dynamic> map) {
              return TransactionModel(
                opNumber: map['opNumber'] ?? '',
                dateTime: map['dateTime'] ?? '',
                name: map['name'] ?? '',
                amount: map['amount'] ?? '',
                toAccount: map['toAccount'] ?? '',
                fromAccount: map['fromAccount'] ?? '1003 0815 8561 0001',
              );
            }
          }
          EOF

      - name: Create lib/services/storage_service.dart
        run: |
          mkdir -p lib/services
          cat << 'EOF' > lib/services/storage_service.dart
          import 'package:hive_flutter/hive_flutter.dart';
          import '../models/transaction_model.dart';

          class StorageService {
            static const String _boxName = 'transactions';
            static const String _listKey = 'list';

            static Future<void> init() async {
              await Hive.initFlutter();
              await Hive.openBox(_boxName);
            }

            static Future<void> addTransaction(TransactionModel transaction) async {
              final box = Hive.box(_boxName);
              final list = List<Map>.from(box.get(_listKey, defaultValue: <Map>[]));
              list.add(transaction.toMap());
              await box.put(_listKey, list);
            }

            static List<TransactionModel> getAllTransactions() {
              final box = Hive.box(_boxName);
              final list = List<Map>.from(box.get(_listKey, defaultValue: <Map>[]));
              return list
                  .map((e) => TransactionModel.fromMap(Map<String, dynamic>.from(e)))
                  .toList()
                  .reversed
                  .toList();
            }

            static Future<void> deleteTransaction(int indexFromNewest) async {
              final box = Hive.box(_boxName);
              final list = List<Map>.from(box.get(_listKey, defaultValue: <Map>[]));
              if (list.isEmpty) return;

              // القائمة المعروضة معكوسة (الأحدث أولاً)
              final realIndex = list.length - 1 - indexFromNewest;
              if (realIndex >= 0 && realIndex < list.length) {
                list.removeAt(realIndex);
                await box.put(_listKey, list);
              }
            }
          }
          EOF

