      - name: Create lib/screens/history_screen.dart
        run: |
          mkdir -p lib/screens
          cat << 'EOF' > lib/screens/history_screen.dart
          import 'package:flutter/material.dart';
          import '../models/transaction_model.dart';
          import '../services/storage_service.dart';
          import 'details_screen.dart';

          class HistoryScreen extends StatefulWidget {
            const HistoryScreen({super.key});

            @override
            State<HistoryScreen> createState() => _HistoryScreenState();
          }

          class _HistoryScreenState extends State<HistoryScreen> {
            List<TransactionModel> transactions = [];

            @override
            void initState() {
              super.initState();
              _load();
            }

            void _load() {
              setState(() {
                transactions = StorageService.getAllTransactions();
              });
            }

            Future<void> _delete(int index) async {
              await StorageService.deleteTransaction(index);
              _load();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF8F8F8),
                appBar: AppBar(
                  title: const Text(
                    'الدفع عبر الموبايل',
                    style: TextStyle(fontFamily: 'Rubik'),
                  ),
                  backgroundColor: const Color(0xFFE31C23),
                  foregroundColor: Colors.white,
                  centerTitle: true,
                ),
                body: transactions.isEmpty
                    ? const Center(
                        child: Text(
                          'لا توجد عمليات سابقة',
                          style: TextStyle(fontFamily: 'Rubik', fontSize: 16),
                        ),
                      )
                    : ListView.builder(
                        padding: const EdgeInsets.all(10),
                        itemCount: transactions.length,
                        itemBuilder: (context, index) {
                          final t = transactions[index];
                          return Card(
                            margin: const EdgeInsets.only(bottom: 8),
                            elevation: 2,
                            child: ListTile(
                              contentPadding: const EdgeInsets.symmetric(horizontal: 14, vertical: 6),
                              title: Text(
                                t.name,
                                textAlign: TextAlign.right,
                                textDirection: TextDirection.rtl,
                                style: const TextStyle(
                                  fontFamily: 'Rubik',
                                  fontWeight: FontWeight.w600,
                                ),
                              ),
                              subtitle: Text(
                                '${t.amount}  |  ${t.dateTime}',
                                textAlign: TextAlign.right,
                                textDirection: TextDirection.rtl,
                                style: const TextStyle(fontFamily: 'Rubik', fontSize: 13),
                              ),
                              trailing: IconButton(
                                icon: const Icon(Icons.delete, color: Colors.red),
                                onPressed: () => _delete(index),
                              ),
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => DetailsScreen(transaction: t),
                                  ),
                                );
                              },
                            ),
                          );
                        },
                      ),
              );
            }
          }
          EOF

      - name: Create lib/screens/details_screen.dart
