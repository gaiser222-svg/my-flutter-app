            }
          }

          class _FooterAction extends StatelessWidget {
            const _FooterAction({
              required this.icon,
              required this.label,
              this.onTap,
            });

            final String icon;
            final String label;
            final VoidCallback? onTap;

            @override
            Widget build(BuildContext context) {
              return GestureDetector(
                onTap: onTap,
                behavior: HitTestBehavior.opaque,
                child: Center(
                  child: Row(
                    mainAxisSize: MainAxisSize.min,
                    textDirection: TextDirection.rtl,
                    children: [
                      Image.asset(
                        icon,
                        width: 24,
                        height: 24,
                        fit: BoxFit.contain,
                        filterQuality: FilterQuality.none,
                      ),
                      const SizedBox(width: 7),
                      Text(
                        label,
                        style: const TextStyle(
                          fontSize: 14,
                          color: Colors.white,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class _FooterDivider extends StatelessWidget {
            const _FooterDivider();

            @override
            Widget build(BuildContext context) {
              return Container(
                width: 1,
                height: 48,
                color: Colors.white,
              );
            }
          }

          class _SuccessFrames extends StatelessWidget {
            const _SuccessFrames({
              required this.animation,
              required this.finished,
            });

            final Animation<double> animation;
            final bool finished;

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: animation,
                builder: (_, __) {
                  final index = finished
                      ? _successFrames.length - 1
                      : (animation.value * _successFrames.length)
                          .floor()
                          .clamp(
                            0,
                            _successFrames.length - 1,
                          );

                  return Image.asset(
                    _successFrames[index],
                    fit: BoxFit.cover,
                    filterQuality: FilterQuality.none,
                  );
                },
              );
            }
          }
