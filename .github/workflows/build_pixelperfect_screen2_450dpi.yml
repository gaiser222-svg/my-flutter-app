                          // ------------------------------------------------
                          // Title
                          //
                          // APK:
                          // resultServTitle
                          // textSize = 18sp
                          // color = white
                          // marginLeft/right = 5dp
                          // marginTop = 10dp
                          // centered
                          // ------------------------------------------------
                          Positioned(
                            top: 130,
