          EOF

      - name: Create lib/screens/transfer_screen.dart
        run: |
          mkdir -p lib/screens
          cat << 'EOF' > lib/screens/transfer_screen.dart
          import 'package:flutter/material.dart';
          import 'dart:math';
          import 'package:intl/intl.dart' hide TextDirection;
          import '../models/transaction_model.dart';
          import '../services/storage_service.dart';
          import 'success_screen.dart';

          class TransferScreen extends StatefulWidget {
            const TransferScreen({super.key});

            @override
            State<TransferScreen> createState() => _TransferScreenState();
          }

          class _TransferScreenState extends State<TransferScreen> {
            final nameController = TextEditingController();
            final accountController = TextEditingController();
            final amountController = TextEditingController();

            // أبعاد الصورة المرجعية (عدّل حسب صورتك الفعلية)
            static const double designWidth = 755;
            static const double designHeight = 1536;

            String _generateOpNumber() {
              final random = Random();
              return List.generate(12, (_) => random.nextInt(10)).join();
            }

            String _currentDateTime() {
              return DateFormat('dd-MMM-yyyy HH:mm:ss').format(DateTime.now());
            }

            Future<void> _submit() async {
              final name = nameController.text.trim();
              final account = accountController.text.trim();
              final amountText = amountController.text.trim();

              if (name.isEmpty || account.isEmpty || amountText.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('يرجى إدخال جميع البيانات')),
                );
                return;
              }

              final amount = double.tryParse(amountText);
              if (amount == null || amount <= 0) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('يرجى إدخال مبلغ صحيح')),
                );
                return;
              }

              final transaction = TransactionModel(
                opNumber: _generateOpNumber(),
                dateTime: _currentDateTime(),
                name: name,
                amount: amount.toStringAsFixed(2),
                toAccount: account,
              );

              await StorageService.addTransaction(transaction);

              if (!mounted) return;

              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => SuccessScreen(transaction: transaction),
                ),
              );
            }

            @override
            void dispose() {
              nameController.dispose();
              accountController.dispose();
              amountController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                resizeToAvoidBottomInset: false,
                backgroundColor: Colors.white,
                body: SafeArea(
                  top: false,
                  bottom: false,
                  child: LayoutBuilder(
                    builder: (context, constraints) {
                      final scale = constraints.maxWidth / designWidth;
                      final actualHeight = designHeight * scale;

                      return Center(
                        child: SizedBox(
                          width: constraints.maxWidth,
                          height: actualHeight,
                          child: Stack(
                            children: [
                              // الخلفية من القالب
                              Positioned.fill(
                                child: Image.asset(
                                  'assets/images/image1.png',
                                  fit: BoxFit.fill,
                                  filterQuality: FilterQuality.none,
                                ),
                              ),

                              // حقل اسم المستفيد
                              _input(
                                controller: nameController,
                                left: 25,
                                top: 393,
                                width: 705,
                                height: 105,
                                scale: scale,
                              ),

                              // حقل رقم الحساب
                              _input(
                                controller: accountController,
                                left: 25,
                                top: 527,
                                width: 705,
                                height: 105,
                                scale: scale,
                                keyboardType: TextInputType.number,
                              ),

                              // حقل المبلغ
                              _input(
                                controller: amountController,
                                left: 25,
                                top: 661,
                                width: 705,
                                height: 105,
                                scale: scale,
                                keyboardType: const TextInputType.numberWithOptions(decimal: true),
                              ),

                              // زر إرسال (شفاف فوق الزر الأصلي في الصورة)
                              Positioned(
                                left: 20 * scale,
                                top: 793 * scale,
                                width: 210 * scale,
                                height: 108 * scale,
                                child: Material(
                                  color: Colors.transparent,
                                  child: InkWell(
                                    onTap: _submit,
                                    splashColor: Colors.transparent,
                                    highlightColor: Colors.transparent,
                                    child: const SizedBox.expand(),
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      );
                    },
                  ),
                ),
              );
            }

            Widget _input({
              required TextEditingController controller,
              required double left,
              required double top,
              required double width,
              required double height,
              required double scale,
              TextInputType? keyboardType,
            }) {
              return Positioned(
                left: left * scale,
                top: top * scale,
                width: width * scale,
                height: height * scale,
                child: TextField(
                  controller: controller,
                  keyboardType: keyboardType,
                  textDirection: TextDirection.rtl,
                  textAlign: TextAlign.right,
                  style: TextStyle(
                    fontSize: 19 * scale,
                    color: const Color(0xFF707071),
                    fontWeight: FontWeight.w400,
                  ),
                  decoration: const InputDecoration(
                    border: InputBorder.none,
                    enabledBorder: InputBorder.none,
                    focusedBorder: InputBorder.none,
                    contentPadding: EdgeInsets.zero,
                    isDense: true,
                  ),
                  cursorColor: const Color(0xFF707071),
                  cursorWidth: 1.5,
                  maxLines: 1,
                ),
              );
            }
          }
          EOF

