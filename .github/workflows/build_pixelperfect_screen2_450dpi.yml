                          //
                          // uae_pay_sucess_result_print_lay.xml:
                          // width  = 100dp
                          // height = 100dp
                          // marginTop = 20dp
                          // gravity = center
                          // scaleType = centerCrop
                          //
                          // مهم:
                          // resultcircle.png (300x300) ليس هو الأيقونة
                          // الرئيسية لهذه الشاشة؛ هو مستخدم في الـdialog.
                          // ------------------------------------------------
                          Positioned(
                            top: 20,
                            left: 0,
                            right: 0,
