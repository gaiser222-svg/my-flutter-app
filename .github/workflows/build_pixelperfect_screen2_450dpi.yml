      - name: Get dependencies
        run: flutter pub get

      - name: Patch gal plugin build.gradle (fix missing/broken compileSdk)
        run: |
          GAL_GRADLE=$(ls "$HOME"/.pub-cache/hosted/pub.dev/gal-*/android/build.gradle 2>/dev/null | head -n 1)
          if [ -n "$GAL_GRADLE" ]; then
            echo "Found gal build.gradle at: $GAL_GRADLE"
            cat "$GAL_GRADLE"
            if grep -qE "compileSdk(Version)? " "$GAL_GRADLE"; then
              sed -i -E 's/compileSdk(Version)? .*/compileSdkVersion 34/' "$GAL_GRADLE"
              echo "Replaced existing compileSdk/compileSdkVersion line."
            else
              sed -i '/^android {/a\    compileSdkVersion 34' "$GAL_GRADLE"
              echo "Inserted new compileSdkVersion line."
            fi
            echo "----- After patch -----"
            cat "$GAL_GRADLE"
          else
            echo "gal build.gradle not found in pub-cache, skipping patch."
          fi

      - name: Analyze (optional, won't fail build)
        run: flutter analyze || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bankak-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
