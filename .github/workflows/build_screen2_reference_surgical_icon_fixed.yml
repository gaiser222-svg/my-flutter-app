                onTap: () {},
                child: Container(
                  width: 160 * s,
                  height: 44 * s,
                  decoration: BoxDecoration(
                    color: Colors.white,
                    border: Border.all(color: const Color(0xFFC43D3D), width: 2 * s),
                    borderRadius: BorderRadius.circular(22 * s),
                  ),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(
                        'تحويل خاطئ',
                        textDirection: TextDirection.rtl,
                        style: TextStyle(
                          fontFamily: 'Rubik',
                          fontSize: 15 * s,
                          color: const Color(0xFFC43D3D),
                        ),
                      ),
                      SizedBox(width: 7 * s),
                      img('assets/block_icon.png', 20, 20, s),
                    ],
                  ),
                ),
              );
            }

            Widget footerItem(
              BuildContext c,
              String icon,
              String text,
              VoidCallback? action,
            ) {
              final s = k(c);
              return Expanded(
                child: GestureDetector(
                  onTap: action,
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      img(icon, 20, 20, s),
                      SizedBox(width: 3 * s),
                      Text(
                        text,
                        textDirection: TextDirection.rtl,
                        style: TextStyle(
                          fontFamily: 'Rubik',
                          fontSize: 14 * s,
                          height: 1,
                          color: const Color(0xFF555555),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final t = widget.transaction;
              final s = k(context);

              return Screenshot(
                controller: _screenshotController,
                child: Scaffold(
                  backgroundColor: Colors.white,
