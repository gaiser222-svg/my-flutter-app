          EOF

      - name: Create lib/screens/transfer_screen.dart
        run: |
          mkdir -p lib/screens
          cat << 'EOF' > lib/screens/transfer_screen.dart
          import 'package:flutter/material.dart';
          import 'dart:math';
          import 'package:intl/intl.dart' hide TextDirection;
          import '../models/transaction_model.dart';
          import '../services/storage_service.dart';
          import 'success_screen.dart';

          class TransferScreen extends StatefulWidget {
            const TransferScreen({super.key});

            @override
            State<TransferScreen> createState() => _TransferScreenState();
          }

          class _TransferScreenState extends State<TransferScreen> {
            final nameController = TextEditingController();
            final accountController = TextEditingController();
            final amountController = TextEditingController();

            // أبعاد الصورة المرجعية (عدّل حسب صورتك الفعلية)
            static const double designWidth = 755;
            static const double designHeight = 1536;

            String _generateOpNumber() {
              final random = Random();
              return List.generate(12, (_) => random.nextInt(10)).join();
            }

            String _currentDateTime() {
              return DateFormat('dd-MMM-yyyy HH:mm:ss').format(DateTime.now());
            }

            Future<void> _submit() async {
              final name = nameController.text.trim();
              final account = accountController.text.trim();
              final amountText = amountController.text.trim();

              if (name.isEmpty || account.isEmpty || amountText.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('يرجى إدخال جميع البيانات')),
                );
                return;
              }

              final amount = double.tryParse(amountText);
              if (amount == null || amount <= 0) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('يرجى إدخال مبلغ صحيح')),
                );
                return;
              }

              final transaction = TransactionModel(
                opNumber: _generateOpNumber(),
                dateTime: _currentDateTime(),
                name: name,
                amount: amount.toStringAsFixed(2),
                toAccount: account,
              );

              await StorageService.addTransaction(transaction);

              if (!mounted) return;

              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => SuccessScreen(transaction: transaction),
                ),
              );
            }

            @override
            void dispose() {
              nameController.dispose();
              accountController.dispose();
              amountController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                resizeToAvoidBottomInset: false,
                backgroundColor: Colors.white,
                body: SafeArea(
                  top: false,
                  bottom: false,
                  child: LayoutBuilder(
                    builder: (context, constraints) {
                      final scale = constraints.maxWidth / designWidth;
                      final actualHeight = designHeight * scale;

                      return Center(
                        child: SizedBox(
                          width: constraints.maxWidth,
                          height: actualHeight,
                          child: Stack(
                            children: [
                              // الخلفية من القالب
                              Positioned.fill(
                                child: Image.asset(
                                  'assets/images/image1.png',
                                  fit: BoxFit.fill,
                                  filterQuality: FilterQuality.none,
                                ),
                              ),

                              // حقل اسم المستفيد
                              _input(
                                controller: nameController,
                                left: 25,
                                top: 393,
                                width: 705,
                                height: 105,
                                scale: scale,
                              ),

                              // حقل رقم الحساب
                              _input(
                                controller: accountController,
                                left: 25,
                                top: 527,
                                width: 705,
                                height: 105,
                                scale: scale,
                                keyboardType: TextInputType.number,
                              ),

                              // حقل المبلغ
                              _input(
                                controller: amountController,
                                left: 25,
                                top: 661,
                                width: 705,
                                height: 105,
                                scale: scale,
                                keyboardType: const TextInputType.numberWithOptions(decimal: true),
                              ),

                              // زر إرسال (شفاف فوق الزر الأصلي في الصورة)
                              Positioned(
                                left: 20 * scale,
                                top: 793 * scale,
                                width: 210 * scale,
                                height: 108 * scale,
                                child: Material(
                                  color: Colors.transparent,
                                  child: InkWell(
                                    onTap: _submit,
                                    splashColor: Colors.transparent,
                                    highlightColor: Colors.transparent,
                                    child: const SizedBox.expand(),
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      );
                    },
                  ),
                ),
              );
            }

            Widget _input({
              required TextEditingController controller,
              required double left,
              required double top,
              required double width,
              required double height,
              required double scale,
              TextInputType? keyboardType,
            }) {
              return Positioned(
                left: left * scale,
                top: top * scale,
                width: width * scale,
                height: height * scale,
                child: TextField(
                  controller: controller,
                  keyboardType: keyboardType,
                  textDirection: TextDirection.rtl,
                  textAlign: TextAlign.right,
                  style: TextStyle(
                    fontSize: 19 * scale,
                    color: const Color(0xFF707071),
                    fontWeight: FontWeight.w400,
                  ),
                  decoration: const InputDecoration(
                    border: InputBorder.none,
                    enabledBorder: InputBorder.none,
                    focusedBorder: InputBorder.none,
                    contentPadding: EdgeInsets.zero,
                    isDense: true,
                  ),
                  cursorColor: const Color(0xFF707071),
                  cursorWidth: 1.5,
                  maxLines: 1,
                ),
              );
            }
          }
          EOF

      - name: Create lib/screens/success_screen.dart
        run: |
          mkdir -p lib/screens
          cat << 'EOF' > lib/screens/success_screen.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import '../models/transaction_model.dart';
          import 'menu_screen.dart';

          /// Pixel-locked reconstruction of the green payment-success receipt.
          /// Accepts TransactionModel and converts it to rows internally.
          class SuccessScreen extends StatefulWidget {
            final TransactionModel transaction;

            const SuccessScreen({
              super.key,
              required this.transaction,
            });

            @override
            State<SuccessScreen> createState() => _SuccessScreenState();
          }

          class _SuccessScreenState extends State<SuccessScreen>
              with SingleTickerProviderStateMixin {
            static const Size design = Size(688, 1536);

            late final AnimationController _animation;
            bool _animationFinished = false;

            @override
            void initState() {
              super.initState();
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);

              _animation = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 900),
              )..addStatusListener((status) {
                  if (status == AnimationStatus.completed && mounted) {
                    setState(() => _animationFinished = true);
                  }
                });

              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (mounted) _animation.forward();
              });
            }

            @override
            void dispose() {
              _animation.dispose();
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              super.dispose();
            }

            /// Convert TransactionModel → rows [value, unused, label]
            List<List<String>> get _rows {
              final t = widget.transaction;
              return [
                [t.opNumber, '', 'رقم العملية'],
                [t.dateTime, '', 'التاريخ و الزمن'],
                [t.fromAccount, '', 'من حساب'],
                [t.toAccount, '', 'الى حساب'],
                [t.name, '', 'إسم المرسل اليه'],
                ['N/A', '', 'رقم الموبايل'],
                ['N/A', '', 'التعليق'],
                [t.amount, '', 'المبلغ'],
              ];
            }

            void _onOk() {
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => MenuScreen(transaction: widget.transaction),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.transparent,
                body: LayoutBuilder(
                  builder: (context, constraints) {
                    final scale = _uniformScale(constraints.biggest);
                    final canvasW = design.width * scale;
                    final canvasH = design.height * scale;
                    final left = (constraints.maxWidth - canvasW) / 2;
                    final top = (constraints.maxHeight - canvasH) / 2;

                    return Stack(
                      children: [
                        Positioned(
                          left: left,
                          top: top,
                          width: canvasW,
                          height: canvasH,
                          child: _DesignCanvas(
                            scale: scale,
                            rows: _rows,
                            animation: _animation,
                            animationFinished: _animationFinished,
                            onOk: _onOk,
                            onShare: () {},
                            onPrint: () {},
                            onDownload: () {},
                            onAddContact: () {},
                            onTransfer: () {},
                          ),
                        ),
                      ],
                    );
                  },
                ),
              );
            }

            double _uniformScale(Size available) {
              final sx = available.width / design.width;
              final sy = available.height / design.height;
              return sx < sy ? sx : sy;
            }
          }

          // ─────────────────────────────────────────────────────────────
          // Design Canvas (Pixel-locked)
          // ─────────────────────────────────────────────────────────────

          class _DesignCanvas extends StatelessWidget {
            const _DesignCanvas({
              required this.scale,
              required this.rows,
              required this.animation,
              required this.animationFinished,
              this.onOk,
              this.onShare,
              this.onPrint,
              this.onDownload,
              this.onAddContact,
              this.onTransfer,
            });

            final double scale;
            final List<List<String>> rows;
            final Animation<double> animation;
            final bool animationFinished;
            final VoidCallback? onOk;
            final VoidCallback? onShare;
            final VoidCallback? onPrint;
            final VoidCallback? onDownload;
            final VoidCallback? onAddContact;
            final VoidCallback? onTransfer;

            double p(double v) => v * scale;

            String valueAt(int index) {
              if (index >= rows.length) return '';
              if (rows[index].isEmpty) return '';
              return rows[index][0];
            }

            // Geometry measured from the supplied APK reference screenshot.
            // Seven ordinary rows are ~86 canvas px; the recipient-name row
            // is taller because its Arabic value may wrap to two lines.
            double _rowTop(int index) {
              const tops = <double>[
                467, 553, 639, 725, 811, 920, 1006, 1092,
              ];
              return tops[index];
            }

            double _rowHeight(int index) {
              return index == 4 ? 109 : 86;
            }

            @override
            Widget build(BuildContext context) {
              return ClipRect(
                child: Stack(
                  children: [
                    const Positioned.fill(
                      child: Image(
                        image: AssetImage('assets/successscreenbg.png'),
                        fit: BoxFit.fill,
                        filterQuality: FilterQuality.none,
                      ),
                    ),

                    // Main success icon.
                    //
                    // APK XML: 100dp x 100dp, centered, marginTop = 20dp.
                    //
                    // The DesignCanvas is 688 wide while this device is
                    // 1080 physical pixels wide. At 450dpi:
                    // 100dp = 281.25 physical px
                    // 281.25 * (688 / 1080) = 179.17 design px
                    //
                    // Therefore the APK's 100dp icon maps to ~179 design
                    // units in this project's canvas; using 100 directly
                    // would incorrectly make it much too small.
                    const double successIcon = 179.17;
                    const double successIconLeft = (688 - successIcon) / 2;
                    const double successIconTop = 35.83; // 20dp mapped to canvas

                    Positioned(
                      left: p(successIconLeft),
                      top: p(successIconTop),
                      width: p(successIcon),
                      height: p(successIcon),
                      child: _SuccessFrames(
                        animation: animation,
                        finished: animationFinished,
                      ),
                    ),

                    // APK: title is 18sp, centered, marginTop = 10dp
                    // below the 100dp success icon.
                    // 10dp maps to 17.92 design units on this canvas.
                    Positioned(
                      left: p(0),
                      top: p(232.92),
                      width: p(688),
                      height: p(48),
                      child: const _Text(
                        'تحويلات',
                        size: 18,
                        weight: FontWeight.w400,
                        align: TextAlign.center,
                      ),
                    ),

                    // Receipt rows
                    for (int i = 0; i < 8; i++)
                      Positioned(
                        left: p(10),
                        top: p(_rowTop(i)),
                        width: p(668),
                        height: p(_rowHeight(i)),
                        child: _ReceiptRow(
                          scale: scale,
                          label: _labels[i],
                          value: valueAt(i),
                        ),
                      ),

                    // OK button
                    Positioned(
                      left: p(244),
                      top: p(1197),
                      width: p(200),
                      height: p(140),
                      child: GestureDetector(
                        onTap: onOk,
                        child: const Stack(
                          fit: StackFit.expand,
                          children: [
                            Image(
                              image: AssetImage('assets/sucessbutton.png'),
                              fit: BoxFit.fill,
                              filterQuality: FilterQuality.none,
                            ),
                            Center(
                              child: _Text('موافق', size: 14, weight: FontWeight.w400),
                            ),
                          ],
                        ),
                      ),
                    ),

                    // Add contact
                    Positioned(
                      left: p(42),
                      top: p(1300),
                      width: p(100),
                      height: p(100),
                      child: GestureDetector(
                        onTap: onAddContact,
                        child: const Image(
                          image: AssetImage('assets/newaddmore.png'),
                          fit: BoxFit.fill,
                          filterQuality: FilterQuality.none,
                        ),
                      ),
                    ),

                    // SDC / Transfer
                    Positioned(
                      left: p(546),
                      top: p(1300),
                      width: p(100),
                      height: p(100),
                      child: GestureDetector(
                        onTap: onTransfer,
                        child: const Image(
                          image: AssetImage('assets/usdcr.png'),
                          fit: BoxFit.fill,
                          filterQuality: FilterQuality.none,
                        ),
                      ),
                    ),

                    // Footer
                    Positioned(
                      left: 0,
                      top: p(1424),
                      width: p(688),
                      height: p(52),
                      child: _Footer(
                        scale: scale,
                        onShare: onShare,
                        onPrint: onPrint,
                        onDownload: onDownload,
                      ),
                    ),

                    // Copyright
                    Positioned(
                      left: 0,
                      top: p(1476),
                      width: p(688),
                      height: p(34),
                      child: const _Text(
                        '©2024 بنك الخرطوم|بنكك حساب',
                        size: 12,
                        weight: FontWeight.w400,
                        align: TextAlign.center,
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          const List<String> _labels = <String>[
            'رقم العملية',
            'التاريخ و الزمن',
            'من حساب',
            'الى حساب',
            'إسم المرسل اليه',
            'رقم الموبايل',
            'التعليق',
            'المبلغ',
          ];

          class _ReceiptRow extends StatelessWidget {
            const _ReceiptRow({
              required this.scale,
              required this.label,
              required this.value,
            });

            final double scale;
            final String label;
            final String value;

            double p(double v) => v * scale;

            @override
            Widget build(BuildContext context) {
              return DecoratedBox(
                decoration: BoxDecoration(
                  border: Border.all(color: Colors.white, width: p(2)),
                  borderRadius: BorderRadius.circular(p(10)),
                ),
                child: Stack(
                  children: [
                    Positioned(
                      right: p(15),
                      top: 0,
                      width: p(220),
                      height: p(75),
                      child: Align(
                        alignment: Alignment.centerRight,
                        child: _Text(label, size: 14, weight: FontWeight.w700),
                      ),
                    ),
                    Positioned(
                      left: p(15),
                      top: 0,
                      width: p(580),
                      height: p(75),
                      child: Align(
                        alignment: Alignment.centerLeft,
                        child: _Text(
                          value,
                          size: 14,
                          weight: FontWeight.w400,
                          direction: TextDirection.ltr,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _Footer extends StatelessWidget {
            const _Footer({
              required this.scale,
              this.onShare,
              this.onPrint,
              this.onDownload,
            });

            final double scale;
            final VoidCallback? onShare;
            final VoidCallback? onPrint;
            final VoidCallback? onDownload;

            double p(double v) => v * scale;

            @override
            Widget build(BuildContext context) {
              return DecoratedBox(
                decoration: BoxDecoration(
                  border: Border.all(color: Colors.white, width: p(2)),
                ),
                child: Row(
                  textDirection: TextDirection.rtl,
                  children: [
                    Expanded(
                      child: _FooterAction(
                        icon: 'assets/share.png',
                        label: 'مشاركة',
                        scale: scale,
                        onTap: onShare,
                      ),
                    ),
                    _FooterDivider(scale: scale),
                    Expanded(
                      child: _FooterAction(
                        icon: 'assets/print.png',
                        label: 'طباعة',
                        scale: scale,
                        onTap: onPrint,
                      ),
                    ),
                    _FooterDivider(scale: scale),
                    Expanded(
                      child: _FooterAction(
                        icon: 'assets/download.png',
                        label: 'تحميل',
                        scale: scale,
                        onTap: onDownload,
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _FooterAction extends StatelessWidget {
            const _FooterAction({
              required this.icon,
              required this.label,
              required this.scale,
              this.onTap,
            });

            final String icon;
            final String label;
            final double scale;
            final VoidCallback? onTap;

            double p(double v) => v * scale;

            @override
            Widget build(BuildContext context) {
              return GestureDetector(
                onTap: onTap,
                behavior: HitTestBehavior.opaque,
                child: Center(
                  child: Row(
                    mainAxisSize: MainAxisSize.min,
                    textDirection: TextDirection.rtl,
                    children: [
                      Image.asset(
                        icon,
                        width: p(24),
                        height: p(24),
                        filterQuality: FilterQuality.none,
                      ),
                      SizedBox(width: p(7)),
                      _Text(label, size: 14, weight: FontWeight.w400),
                    ],
                  ),
                ),
              );
            }
          }

          class _FooterDivider extends StatelessWidget {
            const _FooterDivider({required this.scale});
            final double scale;

            @override
            Widget build(BuildContext context) {
              return Container(
                width: 1 * scale,
                height: 48 * scale,
                color: Colors.white,
              );
            }
          }

          class _SuccessFrames extends StatelessWidget {
            const _SuccessFrames({
              required this.animation,
              required this.finished,
            });

            final Animation<double> animation;
            final bool finished;

            static const List<String> frames = [
              'assets/sucess.png',
              'assets/sucess1.png',
              'assets/sucess2.png',
              'assets/sucess3.png',
              'assets/sucess4.png',
              'assets/sucess5.png',
              'assets/sucess6.png',
              'assets/sucess7.png',
              'assets/sucess8.png',
            ];

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: animation,
                builder: (_, __) {
                  final index = finished
                      ? frames.length - 1
                      : (animation.value * frames.length)
                          .floor()
                          .clamp(0, frames.length - 1);

                  return Image.asset(
                    frames[index],
                    fit: BoxFit.fill,
                    filterQuality: FilterQuality.none,
                  );
                },
              );
            }
          }

          class _Text extends StatelessWidget {
            const _Text(
              this.text, {
              required this.size,
              this.weight = FontWeight.w400,
              this.align = TextAlign.start,
              this.direction = TextDirection.rtl,
            });

            final String text;
            final double size;
            final FontWeight weight;
            final TextAlign align;
            final TextDirection direction;

            @override
            Widget build(BuildContext context) {
              return Text(
                text,
                textAlign: align,
                textDirection: direction,
                maxLines: 1,
                softWrap: false,
                overflow: TextOverflow.clip,
                style: TextStyle(
                  fontFamily: 'Rubik',
                  fontSize: size,
                  fontWeight: weight,
                  color: Colors.white,
                  height: 1.0,
                  leadingDistribution: TextLeadingDistribution.even,
                ),
              );
            }
          }
          EOF

