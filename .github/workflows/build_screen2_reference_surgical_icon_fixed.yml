          import 'package:flutter/material.dart';
          import 'package:screenshot/screenshot.dart';
          import 'package:gal/gal.dart';
          import 'package:permission_handler/permission_handler.dart';
          import '../models/transaction_model.dart';

          class DetailsScreen extends StatefulWidget {
            final TransactionModel transaction;

            const DetailsScreen({super.key, required this.transaction});

            @override
            State<DetailsScreen> createState() => _DetailsScreenState();
          }

          class _DetailsScreenState extends State<DetailsScreen> {
            final ScreenshotController _screenshotController = ScreenshotController();
            static const designWidth = 360.0;
            static const titleColor = Color(0xFF231F20);

            double k(BuildContext c) => MediaQuery.sizeOf(c).width / designWidth;

            Future<void> _saveToGallery() async {
              try {
                final status = await Permission.photos.request();
                if (!status.isGranted && !status.isLimited) {
                  // على أندرويد الحديث gal قد يشتغل بدون هذا الإذن
                }

                final image = await _screenshotController.capture(
                  delay: const Duration(milliseconds: 100),
                );

                if (image != null) {
                  await Gal.putImageBytes(
                    image,
                    name: 'bankak_${widget.transaction.opNumber}',
                  );
                  if (mounted) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(content: Text('تم الحفظ في المعرض بنجاح')),
                    );
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('فشل الحفظ: $e')),
                  );
                }
              }
            }

            Widget img(String path, double w, double h, double s) {
              return Image.asset(
                path,
                width: w * s,
                height: h * s,
                fit: BoxFit.contain,
                filterQuality: FilterQuality.none,
              );
            }

            Widget receiptRow(BuildContext c, String label, String value) {
              final s = k(c);
              return Container(
                height: 43 * s,
                margin: EdgeInsets.only(bottom: 6 * s),
                decoration: BoxDecoration(
                  color: Colors.white,
                  border: Border.all(color: const Color(0xFF9E9E9E), width: 1 * s),
                  borderRadius: BorderRadius.circular(6 * s),
                ),
                child: Row(
                  textDirection: TextDirection.rtl,
                  children: [
                    SizedBox(
                      width: 150 * s,
                      child: Padding(
                        padding: EdgeInsets.symmetric(horizontal: 7 * s),
                        child: Align(
                          alignment: Alignment.centerRight,
                          child: Text(
                            label,
                            maxLines: 1,
                            textDirection: TextDirection.rtl,
                            style: TextStyle(
                              fontFamily: 'Rubik',
                              fontSize: 15 * s,
                              height: 1,
                              color: const Color(0xFF555555),
                            ),
                          ),
                        ),
                      ),
                    ),
                    Expanded(
                      child: Padding(
                        padding: EdgeInsets.symmetric(horizontal: 7 * s),
                        child: Align(
                          alignment: Alignment.centerLeft,
                          child: Text(
                            value,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            textDirection: TextDirection.ltr,
                            style: TextStyle(
                              fontFamily: 'Rubik',
                              fontSize: 15 * s,
                              height: 1,
                              color: const Color(0xFF555555),
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
